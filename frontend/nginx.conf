server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker 内置 DNS。配合下面的变量式 proxy_pass 使用：
    # nginx 默认在启动时一次性解析 proxy_pass 里的主机名，若此时 api-service
    # 还没起来（依赖未就绪 / 容器被重建换了 IP），会直接 [emerg] host not found
    # 退出，或长期持有旧 IP 导致 502。改为变量式后，域名在每次请求时才解析，
    # 启动不再依赖后端，后端重建后也能自动跟上。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反代：strip /api 前缀转发到后端真实路由（/api/candidates/ -> /candidates/）
    location /api/ {
        set $api_upstream http://api-service:8000;
        # 必须显式 rewrite 去掉 /api：proxy_pass 一旦写成变量形式，
        # nginx 就不再按 location 前缀替换 URI，所有请求都会打到后端根路径。
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 实时通知反代（保持长连接）
    location /sse/ {
        set $api_upstream http://api-service:8000;
        rewrite ^/sse/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Cache-Control "no-cache";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}