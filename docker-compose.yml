services:
  api-service:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    # 密钥与模型配置从宿主机 .env 透传（LLM_API_KEY / EMBEDDING_API_KEY / SECRET_KEY 等）
    env_file:
      - .env
    environment:
      # 容器内覆盖数据库指向 postgres；.env 里的 sqlite 仅用于本地开发
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recruitment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recruitment-net
    volumes:
      # 向量库持久化（Chroma），容器重建不丢索引
      - chroma_data:/app/src/data/chroma
      # LangGraph 挂起状态持久化（等待问卷/面试的 interrupt 状态，丢失则进行中的流程无法 resume）
      - workflow_data:/app/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitment
    networks:
      - recruitment-net
    volumes:
      - pg_data:/var/lib/postgresql/data
    # 表结构由后端 ORM（SQLAlchemy create_all）首次启动时自动创建，种子用户幂等写入
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitment"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - recruitment-net
    depends_on:
      - api-service

networks:
  recruitment-net:
    driver: bridge

volumes:
  pg_data:
  chroma_data:
  workflow_data:
