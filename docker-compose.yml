services:
  api-service:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      # 镜像源：默认国内源（作者本地构建最快）；CI 在海外，用环境变量覆盖成上游源，
      # 否则每次构建都要跨境拉几百 MB 依赖（实测 30~45 分钟）。
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        PIP_INDEX: ${PIP_INDEX:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_HOST: ${PIP_HOST:-mirrors.aliyun.com}
    ports:
      - "8000:8000"
    # 密钥与模型配置从宿主机 .env 透传（LLM_API_KEY / EMBEDDING_API_KEY / SECRET_KEY 等）
    env_file:
      - .env
    environment:
      # 容器内覆盖数据库指向 postgres；.env 里的 sqlite 仅用于本地开发
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recruitment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recruitment-net
    volumes:
      # 向量库持久化（Chroma），容器重建不丢索引
      - chroma_data:/app/src/data/chroma
      # 仅在 DATABASE_URL 指向 sqlite 时使用：LangGraph 挂起状态存本地文件。
      # 容器部署下 DATABASE_URL 是 postgres，checkpointer 走 Postgres
      # （见 src/workflow/runner.py），挂起状态在副本间共享，扩副本不会断链。
      - workflow_data:/app/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitment
    networks:
      - recruitment-net
    volumes:
      - pg_data:/var/lib/postgresql/data
    # 表结构由后端启动时自动执行 alembic 迁移（migrations/），种子用户幂等写入。
    # 首启或升级只需拉新镜像重启，不需要手工跑迁移命令。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitment"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "3000:80"
    networks:
      - recruitment-net
    depends_on:
      - api-service

networks:
  recruitment-net:
    driver: bridge

volumes:
  pg_data:
  chroma_data:
  workflow_data:
